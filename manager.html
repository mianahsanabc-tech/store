<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Panel - Order Operations Hub</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #06080e;
            --bg-card: rgba(18, 24, 38, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.08);
            --bg-input: #0b0e17;
            --accent-cyan: #00f2fe;
            --accent-green: #22c55e;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 242, 254, 0.07) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.07) 0px, transparent 50%),
                url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/block/deepslate.png');
            background-blend-mode: overlay;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding: 30px 20px;
        }

        /* Auth Screen Overlay */
        #auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(4, 6, 12, 0.96);
            backdrop-filter: blur(14px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .auth-card {
            background: #111522;
            border: 1px solid var(--bg-card-border);
            border-top: 3px solid var(--accent-cyan);
            border-radius: 16px;
            padding: 35px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        .auth-card h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        /* Main Container */
        .container {
            max-width: 1280px;
            margin: auto;
        }

        header.manager-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--bg-card-border);
        }

        header.manager-header h1 {
            font-family: 'VT323', monospace;
            font-size: 42px;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-icon {
            font-size: 26px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 10px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Toolbar Controls */
        .toolbar {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--bg-card-border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.15);
        }

        /* Order Cards Grid */
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }

        .order-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--bg-card-border);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .order-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-amber);
        }

        .order-card.status-accepted::before { background: var(--accent-green); }
        .order-card.status-rejected::before { background: var(--accent-red); }
        .order-card.status-hidden::before { background: var(--text-muted); }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .order-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-pending { background: rgba(245, 158, 11, 0.2); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.4); }
        .badge-accepted { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid rgba(34, 197, 94, 0.4); }
        .badge-rejected { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.4); }
        .badge-hidden { background: rgba(148, 163, 184, 0.2); color: var(--text-muted); border: 1px solid rgba(148, 163, 184, 0.4); }

        .order-details {
            margin-bottom: 16px;
            font-size: 13px;
            line-height: 1.6;
        }

        .order-details p {
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .order-details strong {
            color: var(--text-main);
        }

        .proof-img {
            width: 100%;
            max-height: 160px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--bg-card-border);
            margin-top: 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .proof-img:hover {
            transform: scale(1.02);
            border-color: var(--accent-cyan);
        }

        /* Quick Command Banner inside Card */
        .cmd-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 10px;
            border-radius: 6px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: monospace;
            font-size: 12px;
            color: var(--accent-cyan);
        }

        .cmd-copy-btn {
            background: rgba(0, 242, 254, 0.15);
            border: none;
            color: var(--accent-cyan);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
        }

        .cmd-copy-btn:hover {
            background: var(--accent-cyan);
            color: #000;
        }

        /* Action Buttons */
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .accept-btn { background: var(--accent-green); color: #000; }
        .reject-btn { background: var(--accent-red); color: #fff; }
        .hide-btn { background: rgba(255, 255, 255, 0.08); color: var(--text-muted); border: 1px solid var(--bg-card-border); }
        .restore-btn { background: var(--accent-purple); color: #fff; }

        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Lightbox Modal */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
        }

        #lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
        }

        /* Toast Notifications */
        #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 10000; }
        .toast {
            background: #1e293b;
            color: #fff;
            padding: 14px 20px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-cyan);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-top: 10px;
            font-size: 14px;
            animation: slideIn 0.3s ease forwards;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

<!-- Login Lock Screen -->
<div id="auth-overlay">
    <div class="auth-card">
        <h3>🛡️ Manager Gateway</h3>
        <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">Enter manager passcode to access order panel</p>
        <input type="password" id="manager-pass" placeholder="Password">
        <button class="btn accept-btn" id="login-btn" style="width: 100%; margin-top: 10px; padding: 12px;">Authenticate Access</button>
    </div>
</div>

<!-- Image Lightbox Modal -->
<div id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img" src="" alt="Enlarged Payment Proof">
</div>

<div class="container">
    <header class="manager-header">
        <div>
            <h1>ORDER OPERATION HUB</h1>
            <p style="color: var(--text-muted); font-size: 13px;">Review player orders, confirm screenshots, and handle deliveries in real-time.</p>
        </div>
        <div>
            <button class="btn hide-btn" id="refresh-btn" style="padding: 8px 16px;">🔄 Refresh Orders</button>
        </div>
    </header>

    <!-- Stat Dashboard Widgets -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon">📦</div>
            <div>
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">Total Active</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">⏳</div>
            <div>
                <div class="stat-value" id="stat-pending" style="color: var(--accent-amber);">0</div>
                <div class="stat-label">Pending Review</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">✅</div>
            <div>
                <div class="stat-value" id="stat-accepted" style="color: var(--accent-green);">0</div>
                <div class="stat-label">Accepted</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">❌</div>
            <div>
                <div class="stat-value" id="stat-rejected" style="color: var(--accent-red);">0</div>
                <div class="stat-label">Rejected</div>
            </div>
        </div>
    </div>

    <!-- Toolbar Filters -->
    <div class="toolbar">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search by rank, player name, or info...">
        </div>
        <div class="filter-group">
            <select id="status-filter" style="width: auto;">
                <option value="ALL">All Statuses</option>
                <option value="Pending">Pending Only</option>
                <option value="Accepted">Accepted Only</option>
                <option value="Rejected">Rejected Only</option>
                <option value="HIDDEN">Show Hidden Orders</option>
            </select>
        </div>
    </div>

    <!-- Orders Render Grid -->
    <div id="orders-container" class="orders-grid">Loading orders...</div>
</div>

<div id="toast-container"></div>

<script type="module">
    import { db } from './firebase-config.js';
    import { collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    let cachedOrders = [];

    function showToast(message, isError = false) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        if (isError) toast.style.borderLeftColor = 'var(--accent-red)';
        toast.innerText = message;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    // Auth Authentication logic
    document.getElementById('login-btn').addEventListener('click', () => {
        if (document.getElementById('manager-pass').value === "manager1212") {
            document.getElementById('auth-overlay').style.display = "none";
            fetchOrders();
            showToast("Manager panel authenticated successfully!");
        } else {
            showToast("Incorrect password!", true);
        }
    });

    document.getElementById('refresh-btn').addEventListener('click', () => {
        fetchOrders();
        showToast("Orders refreshed!");
    });

    async function fetchOrders() {
        const container = document.getElementById('orders-container');
        container.innerHTML = '<p style="color: var(--text-muted);">Fetching live order list...</p>';
        
        try {
            const querySnapshot = await getDocs(collection(db, "orders"));
            cachedOrders = [];

            querySnapshot.forEach((orderDoc) => {
                cachedOrders.push({
                    id: orderDoc.id,
                    ...orderDoc.data()
                });
            });

            updateStatistics();
            renderOrders();

        } catch(e) {
            console.error(e);
            container.innerHTML = '<p style="color: var(--accent-red);">Failed to load orders from Firestore database.</p>';
        }
    }

    function updateStatistics() {
        let total = 0, pending = 0, accepted = 0, rejected = 0;

        cachedOrders.forEach(o => {
            if (o.hidden) return;
            total++;
            const status = o.status || 'Pending';
            if (status === 'Pending') pending++;
            else if (status === 'Accepted') accepted++;
            else if (status === 'Rejected') rejected++;
        });

        document.getElementById('stat-total').innerText = total;
        document.getElementById('stat-pending').innerText = pending;
        document.getElementById('stat-accepted').innerText = accepted;
        document.getElementById('stat-rejected').innerText = rejected;
    }

    function renderOrders() {
        const container = document.getElementById('orders-container');
        container.innerHTML = '';

        const searchQuery = document.getElementById('search-input').value.toLowerCase();
        const selectedFilter = document.getElementById('status-filter').value;

        let visibleCount = 0;

        cachedOrders.forEach((data) => {
            const isHidden = data.hidden === true;
            const currentStatus = data.status || 'Pending';

            // Filter out hidden unless explicitly selected in dropdown
            if (selectedFilter !== 'HIDDEN' && isHidden) return;
            if (selectedFilter === 'HIDDEN' && !isHidden) return;

            // Apply status dropdown filter
            if (selectedFilter !== 'ALL' && selectedFilter !== 'HIDDEN' && currentStatus !== selectedFilter) {
                return;
            }

            // Search filter search match check
            const rankText = (data.rankName || '').toLowerCase();
            const infoText = (data.additionalInfo || '').toLowerCase();
            if (searchQuery && !rankText.includes(searchQuery) && !infoText.includes(searchQuery)) {
                return;
            }

            visibleCount++;

            const statusBadgeClass = isHidden ? 'badge-hidden' : (currentStatus === 'Accepted' ? 'badge-accepted' : (currentStatus === 'Rejected' ? 'badge-rejected' : 'badge-pending'));
            const cardStatusClass = isHidden ? 'status-hidden' : (currentStatus === 'Accepted' ? 'status-accepted' : (currentStatus === 'Rejected' ? 'status-rejected' : ''));

            // Auto command helper creation (extract username if provided)
            let parsedUsername = data.additionalInfo || 'Player';
            let cmdText = `/lp user ${parsedUsername} parent set ${data.rankName}`;

            const card = document.createElement('div');
            card.className = `order-card ${cardStatusClass}`;
            card.innerHTML = `
                <div>
                    <div class="order-header">
                        <div class="order-title">${data.rankName || 'Store Item'}</div>
                        <span class="badge ${statusBadgeClass}">${isHidden ? 'Hidden' : currentStatus}</span>
                    </div>

                    <div class="order-details">
                        <p><strong>Additional Info / IGN:</strong> ${data.additionalInfo || 'N/A'}</p>
                        ${data.timeEstimate ? `<p><strong>Delivery Time:</strong> ${data.timeEstimate}</p>` : ''}
                        ${data.rejectionReason ? `<p style="color: var(--accent-red);"><strong>Rejection Reason:</strong> ${data.rejectionReason}</p>` : ''}
                    </div>

                    ${data.imageUrl ? `
                        <div style="margin-top: 8px;">
                            <span style="font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Payment Proof</span>
                            <img src="${data.imageUrl}" class="proof-img" onclick="openLightbox('${data.imageUrl}')" alt="Proof">
                        </div>
                    ` : ''}

                    <div class="cmd-box">
                        <span>${cmdText}</span>
                        <button class="cmd-copy-btn" onclick="copyCommand('${cmdText}')">COPY</button>
                    </div>
                </div>

                <div class="btn-group">
                    ${!isHidden ? `
                        <button class="btn accept-btn" onclick="acceptOrder('${data.id}')">Accept</button>
                        <button class="btn reject-btn" onclick="rejectOrder('${data.id}')">Reject</button>
                        <button class="btn hide-btn" onclick="hideOrder('${data.id}', true)">Hide</button>
                    ` : `
                        <button class="btn restore-btn" onclick="hideOrder('${data.id}', false)">Unhide / Restore</button>
                    `}
                </div>
            `;
            container.appendChild(card);
        });

        if (visibleCount === 0) {
            container.innerHTML = `<p style="color: var(--text-muted); grid-column: span 1 / -1; text-align: center; padding: 40px;">No matching orders found.</p>`;
        }
    }

    // Event listeners for searching & filtering
    document.getElementById('search-input').addEventListener('input', renderOrders);
    document.getElementById('status-filter').addEventListener('change', renderOrders);

    // Accept Order
    window.acceptOrder = async function(id) {
        const timeEstimate = prompt("Enter estimated delivery time (e.g. 10-15 minutes):", "15 minutes");
        if (timeEstimate === null) return;

        const orderRef = doc(db, "orders", id);
        await updateDoc(orderRef, { 
            status: 'Accepted',
            timeEstimate: timeEstimate,
            rejectionReason: ""
        });
        showToast('Order accepted successfully!');
        fetchOrders();
    };

    // Reject Order
    window.rejectOrder = async function(id) {
        const reason = prompt("Enter reason for rejection:", "Invalid Payment Screenshot");
        if (reason === null) return;

        const orderRef = doc(db, "orders", id);
        await updateDoc(orderRef, { 
            status: 'Rejected',
            rejectionReason: reason,
            timeEstimate: ""
        });
        showToast('Order marked as rejected!');
        fetchOrders();
    };

    // Hide or Restore Order
    window.hideOrder = async function(id, shouldHide) {
        const actionName = shouldHide ? "hide" : "restore";
        if (confirm(`Are you sure you want to ${actionName} this order?`)) {
            const orderRef = doc(db, "orders", id);
            await updateDoc(orderRef, { 
                hidden: shouldHide
            });
            showToast(`Order ${shouldHide ? 'hidden' : 'restored'}!`);
            fetchOrders();
        }
    };

    // Helper functions
    window.openLightbox = function(url) {
        document.getElementById('lightbox-img').src = url;
        document.getElementById('lightbox').style.display = 'flex';
    };

    window.copyCommand = function(cmd) {
        navigator.clipboard.writeText(cmd);
        showToast("Command copied to clipboard!");
    };
</script>
</body>
</html>
