<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manager Panel - Orders</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
        .order-card { background: #1e1e1e; border: 1px solid #333; padding: 15px; margin-bottom: 15px; border-radius: 6px; }
        img { max-width: 250px; display: block; margin-top: 10px; border: 1px solid #fff; border-radius: 4px; }
        .btn { padding: 8px 12px; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; margin-right: 5px; }
        .accept-btn { background: #28a745; color: white; }
        .reject-btn { background: #dc3545; color: white; }
        .hide-btn { background: #6c757d; color: white; }
        #auth-overlay { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-card { background: #1e1e1e; padding: 20px; border-radius: 8px; width: 300px; text-align: center; border: 1px solid #333; }
        input { padding: 8px; margin: 10px 0; width: 100%; box-sizing: border-box; background: #2b2b2b; color: white; border: 1px solid #444; border-radius: 4px; }
        button.login-btn { background: #007bff; color: white; border: none; padding: 8px; cursor: pointer; width: 100%; border-radius: 4px; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-card">
        <h3>Manager Authentication</h3>
        <input type="password" id="manager-pass" placeholder="Password">
        <button class="login-btn" id="login-btn">Login</button>
    </div>
</div>

<h1>Order Manager Panel</h1>
<div id="orders-container">Loading orders...</div>

<script type="module">
    import { db } from './firebase-config.js';
    import { collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Authentication Check
    document.getElementById('login-btn').addEventListener('click', () => {
        if (document.getElementById('manager-pass').value === "manager1212") {
            document.getElementById('auth-overlay').style.display = "none";
            fetchOrders();
        } else {
            alert("Incorrect password!");
        }
    });

    async function fetchOrders() {
        const container = document.getElementById('orders-container');
        container.innerHTML = 'Loading orders...';
        
        try {
            const querySnapshot = await getDocs(collection(db, "orders"));
            container.innerHTML = '';
            
            let visibleOrdersCount = 0;

            querySnapshot.forEach((orderDoc) => {
                const data = orderDoc.data();
                
                // Skip rendering if order is hidden
                if (data.hidden === true) return;

                visibleOrdersCount++;
                const card = document.createElement('div');
                card.className = 'order-card';
                card.innerHTML = `
                    <p><strong>Rank / User:</strong> ${data.rankName}</p>
                    <p><strong>Additional Info:</strong> ${data.additionalInfo || 'N/A'}</p>
                    <p><strong>Status:</strong> ${data.status}</p>
                    ${data.timeEstimate ? `<p><strong>Delivery Time:</strong> ${data.timeEstimate}</p>` : ''}
                    ${data.rejectionReason ? `<p><strong>Rejection Reason:</strong> ${data.rejectionReason}</p>` : ''}
                    ${data.imageUrl ? `<a href="${data.imageUrl}" target="_blank"><img src="${data.imageUrl}" alt="Payment Proof"></a>` : ''}
                    <br>
                    <button class="btn accept-btn" onclick="acceptOrder('${orderDoc.id}')">Accept Order</button>
                    <button class="btn reject-btn" onclick="rejectOrder('${orderDoc.id}')">Reject Order</button>
                    <button class="btn hide-btn" onclick="hideOrder('${orderDoc.id}')">Hide Order</button>
                `;
                container.appendChild(card);
            });

            if (visibleOrdersCount === 0) {
                container.innerHTML = '<p>No active orders found.</p>';
            }
        } catch(e) {
            console.error(e);
        }
    }

    // Accept Order with Estimated Delivery Time
    window.acceptOrder = async function(id) {
        const timeEstimate = prompt("Enter estimated delivery time (e.g. 10-15 minutes):", "15 minutes");
        if (timeEstimate === null) return;

        const orderRef = doc(db, "orders", id);
        await updateDoc(orderRef, { 
            status: 'Accepted',
            timeEstimate: timeEstimate,
            rejectionReason: ""
        });
        alert('Order accepted!');
        fetchOrders();
    };

    // Reject Order with Custom Reason
    window.rejectOrder = async function(id) {
        const reason = prompt("Enter reason for rejection:", "Invalid Payment Screenshot");
        if (reason === null) return;

        const orderRef = doc(db, "orders", id);
        await updateDoc(orderRef, { 
            status: 'Rejected',
            rejectionReason: reason,
            timeEstimate: ""
        });
        alert('Order rejected!');
        fetchOrders();
    };

    // Hide Order from Manager Panel
    window.hideOrder = async function(id) {
        if (confirm("Are you sure you want to hide this order from the manager panel?")) {
            const orderRef = doc(db, "orders", id);
            await updateDoc(orderRef, { 
                hidden: true
            });
            alert('Order hidden!');
            fetchOrders();
        }
    };
</script>
</body>
</html>
