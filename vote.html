<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Voting Hub - Support & Claim Rewards</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #06080e;
            --bg-card: rgba(18, 24, 38, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.08);
            --bg-input: #0b0e17;
            --accent-cyan: #00f2fe;
            --accent-green: #22c55e;
            --accent-amber: #f59e0b;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 242, 254, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.08) 0px, transparent 50%),
                url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/block/deepslate.png');
            background-blend-mode: overlay;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        header.vote-header {
            text-align: center;
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--bg-card-border);
        }

        header.vote-header h1 {
            font-family: 'VT323', monospace;
            font-size: 52px;
            letter-spacing: 3px;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            margin-bottom: 8px;
        }

        header.vote-header p {
            color: var(--text-muted);
            font-size: 15px;
            max-width: 600px;
            margin: auto;
            line-height: 1.6;
        }

        /* Player Username Input Card */
        .player-bar {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 16px;
            padding: 20px 25px;
            margin-bottom: 35px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: 0 15px 35px -10px rgba(0,0,0,0.5);
        }

        .player-bar label {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-cyan);
            white-space: nowrap;
        }

        .player-bar input {
            flex: 1;
            min-width: 220px;
            padding: 12px 16px;
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .player-bar input:focus {
            border-color: var(--accent-cyan);
        }

        /* Vote Cards Grid */
        .vote-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .vote-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: 16px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            transition: transform 0.25s ease, border-color 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .vote-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-cyan);
            box-shadow: 0 15px 35px -10px rgba(0, 242, 254, 0.2);
        }

        .vote-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
        }

        .site-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .site-icon {
            font-size: 28px;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.2);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .site-name {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .vote-btn {
            flex: 1;
            background: var(--accent-green);
            color: #000;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
            text-align: center;
            transition: opacity 0.2s ease, transform 0.2s ease;
            display: inline-block;
        }

        .vote-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--bg-card-border);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
        }

        /* Toast Notifications */
        #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 10000; }
        .toast {
            background: #1e293b;
            color: #fff;
            padding: 14px 20px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-cyan);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-top: 10px;
            font-size: 14px;
            animation: slideIn 0.3s ease forwards;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <header class="vote-header">
        <h1>SERVER VOTING HUB</h1>
        <p>Support our Minecraft server every 24 hours to earn free in-game keys, claim ranks, and boost our network ranking!</p>
    </header>

    <!-- Interactive Player IGN Assistant -->
    <div class="player-bar">
        <label for="ign-input">🎮 Minecraft Username:</label>
        <input type="text" id="ign-input" placeholder="Enter your IGN (e.g. Steve)" autocomplete="off">
    </div>

    <!-- Dynamic Voting Sites Container -->
    <div id="vote-sites-container" class="vote-grid">
        <p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 40px;">Fetching active voting links...</p>
    </div>
</div>

<div id="toast-container"></div>

<script type="module">
    import { db } from './firebase-config.js';
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    function showToast(message) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = message;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    async function loadVotingSites() {
        const container = document.getElementById('vote-sites-container');
        
        try {
            const querySnap = await getDocs(collection(db, "votesites"));
            container.innerHTML = '';

            if (querySnap.empty) {
                container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 40px;">No voting sites are currently listed.</p>';
                return;
            }

            querySnap.forEach((docSnap) => {
                const data = docSnap.data();
                let siteUrl = data.url || '#';

                if (siteUrl !== '#' && !siteUrl.startsWith('http://') && !siteUrl.startsWith('https://')) {
                    siteUrl = 'https://' + siteUrl;
                }

                const card = document.createElement('div');
                card.className = 'vote-card';
                card.innerHTML = `
                    <div class="site-info">
                        <div class="site-icon">🗳️</div>
                        <div class="site-name">${data.name || 'Voting Site'}</div>
                    </div>
                    <div class="card-actions">
                        <a href="${siteUrl}" target="_blank" class="vote-btn" onclick="handleVoteClick(event, '${siteUrl}')">VOTE NOW ➔</a>
                        <button class="copy-btn" onclick="copyLink('${siteUrl}')" title="Copy Vote URL">📋</button>
                    </div>
                `;
                
                container.appendChild(card);
            });
        } catch (error) {
            console.error("Error fetching voting sites:", error);
            container.innerHTML = '<p style="color: #ef4444; grid-column: 1 / -1; text-align: center; padding: 40px;">Failed to load voting sites. Check your connection or Firebase config.</p>';
        }
    }

    window.handleVoteClick = function(event, url) {
        const ign = document.getElementById('ign-input').value.trim();
        if (ign) {
            navigator.clipboard.writeText(ign);
            showToast(`Copied "${ign}" to clipboard for fast voting!`);
        }
    };

    window.copyLink = function(url) {
        navigator.clipboard.writeText(url);
        showToast("Voting link copied to clipboard!");
    };

    loadVotingSites();
</script>
</body>
</html>
