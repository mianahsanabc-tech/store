<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Vote Sites</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body { background: #1a1a1a; color: #fff; font-family: 'Courier New', monospace; text-align: center; padding: 40px; }
        .vote-card { background: #333; padding: 15px; margin: 10px auto; max-width: 300px; border: 2px solid #555; }
        a { color: #55FF55; text-decoration: none; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Voting Sites</h1>
    <div id="vote-sites-container">
        <p>Loading voting sites...</p>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        async function loadVotingSites() {
            const container = document.getElementById('vote-sites-container');
            
            try {
                const querySnap = await getDocs(collection(db, "votesites"));
                container.innerHTML = '';

                if (querySnap.empty) {
                    container.innerHTML = '<p>No voting sites available right now.</p>';
                    return;
                }

                querySnap.forEach((doc) => {
                    const data = doc.data();
                    let siteUrl = data.url || '#';

                    if (siteUrl !== '#' && !siteUrl.startsWith('http://') && !siteUrl.startsWith('https://')) {
                        siteUrl = 'https://' + siteUrl;
                    }

                    const card = document.createElement('div');
                    card.className = 'vote-card';
                    card.innerHTML = `<a href="${siteUrl}" target="_blank">${data.name || 'Voting Site'}</a>`;
                    
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching voting sites:", error);
                container.innerHTML = '<p>Failed to load voting sites.</p>';
            }
        }

        loadVotingSites();
    </script>
</body>
</html>
