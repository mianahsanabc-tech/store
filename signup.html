<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BRINE SMP - Sign Up</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 8px; width: 320px; border: 1px solid #333; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #2b2b2b; color: white; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        a { color: #007bff; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Create Account</h2>
    <input type="text" id="mc-username" placeholder="Minecraft Username" required>
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="password" id="password" placeholder="Password" required>
    <button id="signup-btn">Sign Up</button>
    <p style="margin-top: 15px; font-size: 14px;">Already have an account? <a href="login.html">Login</a></p>
</div>

<script type="module">
    import { db, auth } from './firebase-config.js';
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    document.getElementById('signup-btn').addEventListener('click', async () => {
        const username = document.getElementById('mc-username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if(!username || !email || !password) return alert("Please fill in all fields!");

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // Save user profile with MC Username
            await setDoc(doc(db, "users", user.uid), {
                mcUsername: username,
                email: email,
                createdAt: new Date()
            });

            alert("Account created successfully!");
            window.location.href = "index.html";
        } catch (error) {
            alert(error.message);
        }
    });
</script>
</body>
</html>
