<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Payment Information</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; padding: 20px; }
        .form-box { max-width: 400px; margin: auto; background: #222; padding: 20px; border-radius: 8px; }
        input, textarea, button { width: 100%; margin-bottom: 15px; padding: 8px; box-sizing: border-box; }
        button { background: #00aa00; color: white; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-box">
    <h2>Submit Payment Info</h2>
    
    <label>Minecraft Username</label>
    <input type="text" id="mc-username" readonly style="background: #333; color: #aaa;">

    <label>Rank Being Purchased</label>
    <input type="text" id="rank-name" readonly style="background: #333; color: #aaa;">

    <label>Upload Payment Screenshot</label>
    <input type="file" id="screenshot-file" accept="image/*">

    <label>Additional Notes</label>
    <textarea id="additional-info" rows="3" placeholder="Transaction ID or notes..."></textarea>

    <button id="submit-btn">Submit Order</button>
</div>

<script type="module">
    import { db, auth } from './firebase-config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { collection, addDoc, doc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    let currentUser = null;
    let mcUsername = "";

    const urlParams = new URLSearchParams(window.location.search);
    const rank = urlParams.get('rank') || 'VIP';
    document.getElementById('rank-name').value = rank;

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            alert("Please log in to make a purchase!");
            window.location.href = "login.html";
            return;
        }
        currentUser = user;

        // Load linked Minecraft username
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
            mcUsername = userDoc.data().mcUsername;
            document.getElementById('mc-username').value = mcUsername;
        }
    });

    const fileToBase64 = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });

    document.getElementById('submit-btn').addEventListener('click', async () => {
        const fileInput = document.getElementById('screenshot-file').files[0];
        const info = document.getElementById('additional-info').value;

        try {
            let imageBase64 = "";
            if (fileInput) imageBase64 = await fileToBase64(fileInput);

            await addDoc(collection(db, "orders"), {
                userId: currentUser.uid,
                mcUsername: mcUsername,
                rankName: rank,
                additionalInfo: info,
                imageUrl: imageBase64,
                status: 'Pending',
                timeEstimate: '',
                rejectionReason: '',
                hidden: false,
                timestamp: serverTimestamp()
            });

            alert('Order submitted successfully!');
            window.location.href = 'status.html';
        } catch (e) {
            alert('Error submitting order: ' + e.message);
        }
    });
</script>
</body>
</html>
