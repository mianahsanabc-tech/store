<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BRINE SMP - Login</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 8px; width: 320px; border: 1px solid #333; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #2b2b2b; color: white; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        a { color: #28a745; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="password" id="password" placeholder="Password" required>
    <button id="login-btn">Login</button>
    <p style="margin-top: 15px; font-size: 14px;">Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<script type="module">
    import { auth } from './firebase-config.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
            await signInWithEmailAndPassword(auth, email, password);
            alert("Logged in successfully!");
            window.location.href = "index.html";
        } catch (error) {
            alert(error.message);
        }
    });
</script>
</body>
</html>
