<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Rank - BRINE SMP</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #121212;
            color: #fff;
            font-family: sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .back-btn {
            display: inline-block;
            background: #2b2b2b;
            color: #aaa;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 16px;
            border: 1px solid #444;
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            background: #3a3a3a;
            color: #fff;
            border-color: #666;
        }
        h2 { font-size: 28px; margin-bottom: 10px; }
        .price { font-size: 18px; color: #ddd; margin-bottom: 15px; }
        .benefits-title { font-weight: bold; margin-bottom: 8px; }
        ul { margin-left: 20px; margin-bottom: 20px; color: #bbb; }
        li { margin-bottom: 6px; }
        .buy-btn {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .buy-btn:hover { background: #218838; }
    </style>
</head>
<body>

<div class="card">
    <a href="index.html" class="back-btn">← Back to Store</a>
    
    <h2 id="rank-title">VIP Rank</h2>
    <div class="price" id="rank-price">Price: Loading...</div>
    
    <div class="benefits-title">Benefits:</div>
    <ul id="rank-benefits">
        <li>Loading features...</li>
    </ul>

    <button class="buy-btn" id="buy-button">Purchase Rank</button>
</div>

<script type="module">
    import { db } from './firebase-config.js';
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Detect rank ID from URL query or default to VIP
    const urlParams = new URLSearchParams(window.location.search);
    const rankId = urlParams.get('rank') || 'VIP';

    async function loadRank() {
        const docSnap = await getDoc(doc(db, "ranks", rankId));
        if (docSnap.exists()) {
            const data = docSnap.data();
            document.getElementById('rank-title').innerText = data.title || rankId;
            document.getElementById('rank-price').innerText = `Price: $${data.price || '0'}`;
            document.getElementById('buy-button').innerText = `Purchase ${data.title || rankId}`;
            
            if (data.benefits && data.benefits.length > 0) {
                const ul = document.getElementById('rank-benefits');
                ul.innerHTML = '';
                data.benefits.forEach(b => {
                    const li = document.createElement('li');
                    li.innerText = b;
                    ul.appendChild(li);
                });
            }
        }
    }

    document.getElementById('buy-button').onclick = () => {
        location.href = `submit1.html?rank=${encodeURIComponent(rankId)}`;
    };

    loadRank();
</script>
</body>
</html>
