<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Store - Official Ranks & Packages</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #06080e;
            --bg-card: rgba(18, 24, 38, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.08);
            --bg-input: #0b0e17;
            --accent-cyan: #00f2fe;
            --accent-green: #22c55e;
            --accent-amber: #f59e0b;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 242, 254, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.08) 0px, transparent 50%),
                url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/block/deepslate.png');
            background-blend-mode: overlay;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        header.store-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--bg-card-border);
        }

        header.store-header h1 {
            font-family: 'VT323', monospace;
            font-size: 54px;
            letter-spacing: 3px;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            margin-bottom: 5px;
        }

        header.store-header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* Ranks Grid */
        .ranks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .rank-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 15px 35px -10px rgba(0,0,0,0.5);
            transition: transform 0.25s ease, border-color 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .rank-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-cyan);
            box-shadow: 0 20px 40px -10px rgba(0, 242, 254, 0.2);
        }

        .rank-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent-cyan);
            margin-bottom: 8px;
        }

        .rank-price {
            font-size: 26px;
            font-weight: 800;
            color: var(--accent-green);
            margin-bottom: 15px;
        }

        .rank-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        .buy-btn {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s ease;
        }

        .buy-btn:hover {
            opacity: 0.9;
        }

        /* Order Modal */
        #checkout-modal {
            position: fixed;
            inset: 0;
            background: rgba(4, 6, 12, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-card {
            background: #111522;
            border: 1px solid var(--bg-card-border);
            border-top: 3px solid var(--accent-cyan);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
        }

        .modal-card h3 {
            font-size: 22px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        input[type="text"] {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--bg-card-border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-cyan);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel-btn {
            background: rgba(255,255,255,0.08);
            color: var(--text-muted);
            border: 1px solid var(--bg-card-border);
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
        }

        /* Toast Notifications */
        #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 10000; }
        .toast {
            background: #1e293b;
            color: #fff;
            padding: 14px 20px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-cyan);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="store-header">
        <h1>SERVER STORE</h1>
        <p>Select your desired rank or package below to place an order.</p>
    </header>

    <!-- Dynamic Ranks Grid (Populated from Firebase Admin Panel additions) -->
    <div id="ranks-container" class="ranks-grid">
        <p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center;">Loading store packages...</p>
    </div>
</div>

<!-- Purchase Modal -->
<div id="checkout-modal">
    <div class="modal-card">
        <h3>Complete Your Order</h3>
        <form id="order-form">
            <div class="form-group">
                <label>Selected Package</label>
                <input type="text" id="selected-rank" readonly style="opacity: 0.7; cursor: not-allowed;">
            </div>
            <div class="form-group">
                <label>In-Game Name (Minecraft IGN)</label>
                <input type="text" id="player-ign" placeholder="e.g. Steve" required>
            </div>
            <div class="form-group">
                <label>Payment Proof Image URL</label>
                <input type="text" id="proof-url" placeholder="https://i.imgur.com/example.png" required>
            </div>
            <div class="modal-actions">
                <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
                <button type="submit" class="buy-btn" style="flex: 1;">Submit Order</button>
            </div>
        </form>
    </div>
</div>

<div id="toast-container"></div>

<script type="module">
    import { db } from './firebase-config.js';
    import { collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    function showToast(message, isError = false) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        if (isError) toast.style.borderLeftColor = 'var(--accent-amber)';
        toast.innerText = message;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    // Fetch and render ranks from the Firestore database added via Admin Panel
    async function loadStoreRanks() {
        const container = document.getElementById('ranks-container');
        
        try {
            // Adjust "ranks" if your Admin Panel saves to a different collection name
            const querySnapshot = await getDocs(collection(db, "ranks"));
            container.innerHTML = '';

            if (querySnapshot.empty) {
                container.innerHTML = `<p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 40px;">No ranks available in the store right now.</p>`;
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                
                const card = document.createElement('div');
                card.className = 'rank-card';
                card.innerHTML = `
                    <div>
                        <div class="rank-title">${data.name || data.rankName || 'Rank Package'}</div>
                        <div class="rank-price">${data.price ? '$' + data.price : 'Free / Custom'}</div>
                        <div class="rank-desc">${data.description || data.perks || 'No description available.'}</div>
                    </div>
                    <button class="buy-btn" onclick="openModal('${data.name || data.rankName}')">Purchase Package</button>
                `;
                container.appendChild(card);
            });

        } catch (e) {
            console.error("Error fetching store items:", e);
            container.innerHTML = `<p style="color: #ef4444; grid-column: 1 / -1; text-align: center;">Failed to load store items. Please check Firebase configuration.</p>`;
        }
    }

    // Modal Helpers
    window.openModal = function(rankName) {
        document.getElementById('selected-rank').value = rankName;
        document.getElementById('checkout-modal').style.display = 'flex';
    };

    window.closeModal = function() {
        document.getElementById('checkout-modal').style.display = 'none';
        document.getElementById('order-form').reset();
    };

    // Submit Order to Firestore
    document.getElementById('order-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const rankName = document.getElementById('selected-rank').value;
        const ign = document.getElementById('player-ign').value.trim();
        const proofUrl = document.getElementById('proof-url').value.trim();

        try {
            await addDoc(collection(db, "orders"), {
                rankName: rankName,
                additionalInfo: ign,
                imageUrl: proofUrl,
                status: 'Pending',
                hidden: false,
                createdAt: new Date().toISOString()
            });

            showToast("Order submitted successfully! Manager will review it shortly.");
            closeModal();
        } catch (err) {
            console.error("Error creating order:", err);
            showToast("Failed to submit order. Please try again.", true);
        }
    });

    // Initialize Store
    loadStoreRanks();
</script>
</body>
</html>
