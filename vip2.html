<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VIP++ Rank Details</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; padding: 20px; }
        .card { background: #2b2b2b; padding: 25px; border-radius: 8px; max-width: 400px; margin: auto; border: 1px solid #444; }
        button { background: #55FF55; border: none; padding: 12px; width: 100%; cursor: pointer; font-weight: bold; color: #000; border-radius: 4px; font-size: 16px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="rank-title">VIP++ Rank</h2>
    <p style="font-size: 18px;">Price: $<span id="rank-price">Loading...</span></p>
    <h3 style="margin-top: 15px;">Benefits:</h3>
    <ul id="rank-benefits"><li>Loading benefits...</li></ul>
    <button onclick="location.href='submit1.html?rank=VIP%2B%2B'">Purchase VIP++ Rank</button>
</div>

<script type="module">
    import { db } from './firebase-config.js';
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    async function loadRankDetails() {
        const docRef = doc(db, "ranks", "VIP++");
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
            const data = docSnap.data();
            document.getElementById('rank-title').innerText = data.title || "VIP++ Rank";
            document.getElementById('rank-price').innerText = data.price || '0.00';
            document.getElementById('rank-benefits').innerHTML = (data.benefits || []).map(b => `<li>${b}</li>`).join('');
        }
    }
    loadRankDetails();
</script>
</body>
</html>
