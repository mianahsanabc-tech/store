<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - BRINE SMP</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #090b10;
            --bg-card: rgba(22, 27, 38, 0.75);
            --bg-card-border: rgba(255, 255, 255, 0.08);
            --bg-input: #0f131d;
            --accent-cyan: #00f2fe;
            --accent-green: #22c55e;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 242, 254, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.08) 0px, transparent 50%),
                url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/block/deepslate.png');
            background-blend-mode: overlay;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding: 30px 20px;
        }

        /* Authentication Modal */
        #auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(4, 6, 12, 0.95);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .auth-card {
            background: #131722;
            border: 1px solid var(--bg-card-border);
            border-top: 3px solid var(--accent-cyan);
            border-radius: 16px;
            padding: 35px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .auth-card h3 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .auth-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* Container Grid */
        .container {
            max-width: 1100px;
            margin: auto;
        }

        header.admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--bg-card-border);
        }

        header.admin-header h1 {
            font-family: 'VT323', monospace;
            font-size: 42px;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
            gap: 24px;
        }

        @media (max-width: 580px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        /* Card Section Styling */
        .section {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--bg-card-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            transition: border-color 0.2s ease;
        }

        .section:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .section-header h3 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        /* Inputs & Labels */
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 14px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--bg-card-border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus, select:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.15);
        }

        /* Switch Toggles */
        .social-row {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .toggle-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0;
            margin-bottom: 8px;
            cursor: pointer;
            text-transform: none;
            color: var(--text-main);
            font-size: 15px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #334155;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent-green); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Buttons */
        button {
            width: 100%;
            padding: 12px 16px;
            margin-top: 16px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary { background: var(--accent-cyan); color: #000; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-success { background: var(--accent-green); color: #000; }
        .btn-success:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-warning { background: var(--accent-amber); color: #000; }
        .btn-warning:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: var(--accent-red); color: #fff; }

        /* Upload Container */
        .custom-file-box {
            background: var(--bg-input);
            border: 1px dashed var(--bg-card-border);
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
        }

        input[type="file"] {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 10000;
        }

        .toast {
            background: #1e293b;
            color: #fff;
            padding: 14px 20px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-cyan);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-top: 10px;
            font-size: 14px;
            animation: slideIn 0.3s ease forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

<!-- Authentication Overlay -->

                <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/diamond.png">Diamond 💎</option>

<div id="toast-container"></div>

<script type="module">
    import { db } from './firebase-config.js';
    import { doc, setDoc, getDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    let customEditLogoBase64 = null;
    let customNewLogoBase64 = null;
    let votingSitesCache = {};

    function showToast(message, isError = false) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        if (isError) toast.style.borderLeftColor = 'var(--accent-red)';
        toast.innerText = message;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // Authentication Login
    document.getElementById('login-btn').addEventListener('click', () => {
        if (document.getElementById('admin-pass').value === "ahsan321") {
            document.getElementById('auth-overlay').style.display = "none";
            loadNotice();
            loadSocialSettings();
            loadVotingSites();
            loadAllRanksIntoSelect();
            showToast("Welcome back, Admin!");
        } else {
            showToast("Invalid password!", true);
        }
    });

    // Broadcast Notice
    async function loadNotice() {
        try {
            const docSnap = await getDoc(doc(db, "settings", "notice"));
            if (docSnap.exists() && docSnap.data().text) {
                document.getElementById('notice-input').value = docSnap.data().text;
            }
        } catch (error) { console.error("Error loading notice:", error); }
    }

    document.getElementById('save-notice').addEventListener('click', async () => {
        const text = document.getElementById('notice-input').value.trim();
        if (!text) return showToast("Please enter a notice message.", true);
        try {
            await setDoc(doc(db, "settings", "notice"), { text: text }, { merge: true });
            showToast("Broadcast notification published!");
        } catch (error) { showToast("Failed to publish notification.", true); }
    });

    document.getElementById('clear-notice').addEventListener('click', async () => {
        try {
            await setDoc(doc(db, "settings", "notice"), { text: "" }, { merge: true });
            document.getElementById('notice-input').value = "";
            showToast("Broadcast notice cleared!");
        } catch (error) { showToast("Failed to clear notification.", true); }
    });

    // Social Links & Switches
    async function loadSocialSettings() {
        try {
            const docSnap = await getDoc(doc(db, "settings", "socials"));
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('discord-url').value = data.discord || '';
                document.getElementById('enable-discord').checked = data.discordEnabled ?? true;

                document.getElementById('youtube-url').value = data.youtube || '';
                document.getElementById('enable-youtube').checked = data.youtubeEnabled ?? true;

                document.getElementById('tiktok-url').value = data.tiktok || '';
                document.getElementById('enable-tiktok').checked = data.tiktokEnabled ?? true;

                document.getElementById('instagram-url').value = data.instagram || '';
                document.getElementById('enable-instagram').checked = data.instagramEnabled ?? true;
            }
        } catch (error) { console.error("Error loading social settings:", error); }
    }

    document.getElementById('save-socials-btn').addEventListener('click', async () => {
        try {
            await setDoc(doc(db, "settings", "socials"), {
                discord: document.getElementById('discord-url').value.trim(),
                discordEnabled: document.getElementById('enable-discord').checked,

                youtube: document.getElementById('youtube-url').value.trim(),
                youtubeEnabled: document.getElementById('enable-youtube').checked,

                tiktok: document.getElementById('tiktok-url').value.trim(),
                tiktokEnabled: document.getElementById('enable-tiktok').checked,

                instagram: document.getElementById('instagram-url').value.trim(),
                instagramEnabled: document.getElementById('enable-instagram').checked
            }, { merge: true });

            showToast("Social links updated successfully!");
        } catch (error) { showToast("Failed to save social settings.", true); }
    });

    // Voting Platforms
    async function loadVotingSites() {
        const select = document.getElementById('vote-site-select');
        select.innerHTML = '';
        votingSitesCache = {};

        try {
            const querySnap = await getDocs(collection(db, "votesites"));
            querySnap.forEach(d => {
                votingSitesCache[d.id] = d.data();
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.innerText = d.data().name || d.id;
                select.appendChild(opt);
            });

            if (Object.keys(votingSitesCache).length > 0) fillVoteSiteForm();
            else {
                document.getElementById('vote-site-name').value = '';
                document.getElementById('vote-site-url').value = '';
            }
        } catch (error) { console.error("Error loading voting sites:", error); }
    }

    function fillVoteSiteForm() {
        const selectedId = document.getElementById('vote-site-select').value;
        if (selectedId && votingSitesCache[selectedId]) {
            document.getElementById('vote-site-name').value = votingSitesCache[selectedId].name || '';
            document.getElementById('vote-site-url').value = votingSitesCache[selectedId].url || '';
        }
    }

    document.getElementById('vote-site-select').addEventListener('change', fillVoteSiteForm);

    document.getElementById('save-vote-site').addEventListener('click', async () => {
        const selectedId = document.getElementById('vote-site-select').value;
        if (!selectedId) return showToast("No voting site selected!", true);

        const name = document.getElementById('vote-site-name').value.trim();
        const url = document.getElementById('vote-site-url').value.trim();
        if (!name || !url) return showToast("Fill out Name and URL.", true);

        try {
            await setDoc(doc(db, "votesites", selectedId), { name: name, url: url }, { merge: true });
            showToast("Voting site updated!");
            loadVotingSites();
        } catch (error) { showToast("Failed to update site.", true); }
    });

    document.getElementById('delete-vote-site').addEventListener('click', async () => {
        const selectedId = document.getElementById('vote-site-select').value;
        if (!selectedId) return showToast("No voting site selected!", true);

        if (confirm("Remove this voting site?")) {
            try {
                await deleteDoc(doc(db, "votesites", selectedId));
                showToast("Voting site removed!");
                loadVotingSites();
            } catch (error) { showToast("Failed to remove voting site.", true); }
        }
    });

    document.getElementById('add-vote-site').addEventListener('click', async () => {
        const name = document.getElementById('new-vote-name').value.trim();
        const url = document.getElementById('new-vote-url').value.trim();
        if (!name || !url) return showToast("Enter Site Name and URL.", true);

        const docId = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
        try {
            await setDoc(doc(db, "votesites", docId), { name: name, url: url });
            showToast("New voting site added!");
            document.getElementById('new-vote-name').value = '';
            document.getElementById('new-vote-url').value = '';
            loadVotingSites();
        } catch (error) { showToast("Failed to add voting site.", true); }
    });

    // Custom File Readers
    document.getElementById('rank-logo-upload').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
            customEditLogoBase64 = await readFileAsDataURL(file);
            showToast("Custom image uploaded and ready!");
        }
    });

    document.getElementById('new-rank-logo-upload').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
            customNewLogoBase64 = await readFileAsDataURL(file);
            showToast("Custom image ready for new rank!");
        }
    });

    // SMP Server Title
    document.getElementById('save-smp-name').addEventListener('click', async () => {
        const name = document.getElementById('smp-name-input').value.trim();
        if (!name) return showToast("Please enter an SMP name.", true);
        await setDoc(doc(db, "settings", "server"), { name: name }, { merge: true });
        showToast("Server title updated!");
    });

    // Rank Controls
    async function loadAllRanksIntoSelect() {
        const select = document.getElementById('rank-select');
        select.innerHTML = '';
        const defaultKeys = ['VIP', 'VIP+', 'VIP++', 'VIP+++'];
        const querySnap = await getDocs(collection(db, "ranks"));
        
        let dbMap = {};
        querySnap.forEach(d => dbMap[d.id] = d.data());

        let keys = [...defaultKeys, ...Object.keys(dbMap)];
        keys = Array.from(new Set(keys)).filter(k => !dbMap[k] || dbMap[k].deleted !== true);

        keys.forEach(k => {
            const opt = document.createElement('option');
            opt.value = k;
            opt.innerText = k;
            select.appendChild(opt);
        });

        if (keys.length > 0) loadRankDetails();
    }

    async function loadRankDetails() {
        const selectedRank = document.getElementById('rank-select').value;
        if (!selectedRank) return;

        customEditLogoBase64 = null;
        document.getElementById('rank-logo-upload').value = "";

        const docSnap = await getDoc(doc(db, "ranks", selectedRank));
        if (docSnap.exists() && !docSnap.data().deleted) {
            const data = docSnap.data();
            document.getElementById('rank-display-title').value = data.title || selectedRank;
            document.getElementById('rank-price-input').value = data.price || '';
            document.getElementById('rank-benefits-input').value = (data.benefits || []).join(', ');
            if (data.logo && !data.logo.startsWith('data:image')) {
                document.getElementById('rank-logo-select').value = data.logo;
            }
        } else {
            document.getElementById('rank-display-title').value = selectedRank;
            document.getElementById('rank-price-input').value = '';
            document.getElementById('rank-benefits-input').value = '';
        }
    }

    document.getElementById('rank-select').addEventListener('change', loadRankDetails);

    document.getElementById('save-rank').addEventListener('click', async () => {
        const rankKey = document.getElementById('rank-select').value;
        if (!rankKey) return;

        const chosenLogo = customEditLogoBase64 || document.getElementById('rank-logo-select').value;
        await setDoc(doc(db, "ranks", rankKey), {
            title: document.getElementById('rank-display-title').value.trim() || rankKey,
            price: document.getElementById('rank-price-input').value.trim(),
            logo: chosenLogo,
            benefits: document.getElementById('rank-benefits-input').value.split(',').map(s => s.trim()).filter(Boolean),
            deleted: false
        }, { merge: true });

        showToast(`${rankKey} rank saved successfully!`);
    });

    document.getElementById('delete-rank').addEventListener('click', async () => {
        const rankKey = document.getElementById('rank-select').value;
        if (!rankKey) return;

        if (confirm(`Remove rank "${rankKey}" from store?`)) {
            await setDoc(doc(db, "ranks", rankKey), { deleted: true }, { merge: true });
            showToast(`Rank "${rankKey}" deleted!`);
            loadAllRanksIntoSelect();
        }
    });

    document.getElementById('create-rank').addEventListener('click', async () => {
        const rankKey = document.getElementById('new-rank-id').value.trim().toUpperCase();
        if(!rankKey) return showToast("Enter a Rank Key ID!", true);

        const chosenLogo = customNewLogoBase64 || document.getElementById('new-rank-logo').value;
        await setDoc(doc(db, "ranks", rankKey), {
            title: document.getElementById('new-rank-title').value.trim() || rankKey,
            price: document.getElementById('new-rank-price').value.trim(),
            logo: chosenLogo,
            benefits: document.getElementById('new-rank-benefits').value.split(',').map(s => s.trim()).filter(Boolean),
            deleted: false
        }, { merge: true });

        showToast(`New rank "${rankKey}" published!`);
        customNewLogoBase64 = null;
        document.getElementById('new-rank-logo-upload').value = "";
        loadAllRanksIntoSelect();
    });
</script>
</body>
</html>
