<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - BRINE SMP</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
        .container { max-width: 650px; margin: auto; }
        .section { background: #1e1e1e; padding: 20px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #333; }
        input, select { padding: 10px; margin: 8px 0; width: 100%; box-sizing: border-box; background: #2b2b2b; color: white; border: 1px solid #444; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; padding: 12px; cursor: pointer; width: 100%; margin-top: 8px; border-radius: 4px; font-weight: bold; }
        button.delete-btn { background: #dc3545; margin-top: 10px; }
        #auth-overlay { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-card { background: #1e1e1e; padding: 25px; border-radius: 8px; width: 300px; text-align: center; border: 1px solid #333; }
        .logo-preview { width: 40px; height: 40px; margin-top: 5px; object-fit: contain; vertical-align: middle; }
        .custom-file-box { background: #222; border: 1px dashed #555; padding: 10px; margin: 8px 0; border-radius: 4px; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-card">
        <h3>Admin Authentication</h3>
        <input type="password" id="admin-pass" placeholder="Password">
        <button id="login-btn">Login</button>
    </div>
</div>

<div class="container">
    <h1>Admin Panel</h1>

    <!-- Notification Broadcast Control -->
    <div class="section">
        <h3>Broadcast Notification Banner</h3>
        <label>Announcement Message:</label>
        <input type="text" id="notice-input" placeholder="e.g. ⚡ 50% OFF SALE THIS WEEKEND ONLY!">
        <button id="save-notice" style="background: #ffc107; color: #000;">Post Broadcast Message</button>
        <button id="clear-notice" class="delete-btn">Clear Notification</button>
    </div>

    <!-- SMP Server Name Settings -->
    <div class="section">
        <h3>Server Name Settings</h3>
        <input type="text" id="smp-name-input" placeholder="BRINE SMP">
        <button id="save-smp-name">Update SMP Server Name</button>
    </div>

    <!-- Social Media Links Management -->
    <div class="section">
        <h3>Social Links Management</h3>
        <label>Discord Link:</label>
        <input type="text" id="discord-input" placeholder="https://discord.gg/yourcode">
        
        <label>YouTube Link:</label>
        <input type="text" id="youtube-input" placeholder="https://youtube.com/@yourchannel">
        
        <label>TikTok Link:</label>
        <input type="text" id="tiktok-input" placeholder="https://tiktok.com/@youraccount">
        
        <button id="save-socials">Update Social Links</button>
    </div>

    <!-- Voting Sites Management -->
    <div class="section">
        <h3>Edit / Delete Voting Sites</h3>
        <label>Select Voting Site:</label>
        <select id="vote-site-select"></select>

        <label>Site Name:</label>
        <input type="text" id="vote-site-name" placeholder="e.g. Planet Minecraft">

        <label>Vote URL Link:</label>
        <input type="text" id="vote-site-url" placeholder="https://planetminecraft.com/server/...">

        <button id="save-vote-site">Update Selected Voting Site</button>
        <button id="delete-vote-site" class="delete-btn">Remove Selected Voting Site</button>
    </div>

    <div class="section">
        <h3>Add New Voting Site</h3>
        <input type="text" id="new-vote-name" placeholder="Site Name (e.g. MinecraftMP)">
        <input type="text" id="new-vote-url" placeholder="URL Link (https://minecraft-mp.com/...)">
        <button id="add-vote-site" style="background: #28a745;">Add Voting Site</button>
    </div>

    <!-- Dynamic Rank, Logo & Remove Rank Editor -->
    <div class="section">
        <h3>Edit / Delete Existing Rank</h3>
        <label>Select Rank Key:</label>
        <select id="rank-select"></select>

        <label>Display Title:</label>
        <input type="text" id="rank-display-title" placeholder="Display Title">

        <label>Price ($):</label>
        <input type="text" id="rank-price-input" placeholder="Price">

        <label>Choose Item Icon Logo:</label>
        <select id="rank-logo-select">
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/golden_sword.png">Gold Sword 🗡️</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/diamond_sword.png">Diamond Sword 🗡️</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/netherite_sword.png">Netherite Sword 🗡️</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/diamond.png">Diamond 💎</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/netherite_chestplate.png">Netherite Chestplate 👕</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/golden_helmet.png">Gold Helmet 🪖</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/block/beacon.png">Beacon 🚨</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/ender_eye.png">Eye of Ender 👁️</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/nether_star.png">Nether Star ⭐</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/golden_apple.png">Golden Apple 🍏</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/emerald.png">Emerald 🟢</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/totem_of_undying.png">Totem of Undying 🗿</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/elytra.png">Elytra 🪽</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/bow.png">Bow 🏹</option>
        </select>

        <div class="custom-file-box">
            <label>Or Upload Custom Image Logo File (.png, .jpg, .svg):</label>
            <input type="file" id="rank-logo-upload" accept="image/*">
        </div>

        <label>Benefits (comma separated):</label>
        <input type="text" id="rank-benefits-input" placeholder="Fly, Kit VIP, 5x Homes">

        <button id="save-rank">Save Rank Updates</button>
        <button id="delete-rank" class="delete-btn">Remove / Delete Selected Rank</button>
    </div>

    <!-- Add New Custom Rank -->
    <div class="section">
        <h3>Create New Custom Rank</h3>
        <input type="text" id="new-rank-id" placeholder="Rank Key ID (e.g. LEGEND)">
        <input type="text" id="new-rank-title" placeholder="Display Title Name">
        <input type="text" id="new-rank-price" placeholder="Price ($)">
        
        <label>Choose Item Icon Logo:</label>
        <select id="new-rank-logo">
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/golden_sword.png">Gold Sword 🗡️</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/diamond_sword.png">Diamond Sword 🗡️</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/diamond.png">Diamond 💎</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/netherite_chestplate.png">Netherite Chestplate 👕</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/block/beacon.png">Beacon 🚨</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/nether_star.png">Nether Star ⭐</option>
            <option value="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/emerald.png">Emerald 🟢</option>
        </select>

        <div class="custom-file-box">
            <label>Or Upload Custom Image File (.png, .jpg, .svg):</label>
            <input type="file" id="new-rank-logo-upload" accept="image/*">
        </div>

        <input type="text" id="new-rank-benefits" placeholder="Benefits (comma separated)">
        <button id="create-rank" style="background: #28a745;">Add New Rank</button>
    </div>
</div>

<script type="module">
    import { db } from './firebase-config.js';
    import { doc, setDoc, getDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    let customEditLogoBase64 = null;
    let customNewLogoBase64 = null;
    let votingSitesCache = {};

    function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // Auth Login
    document.getElementById('login-btn').addEventListener('click', () => {
        if (document.getElementById('admin-pass').value === "ahsan321") {
            document.getElementById('auth-overlay').style.display = "none";
            loadNotice();
            loadSocials();
            loadVotingSites();
            loadAllRanksIntoSelect();
        } else {
            alert("Incorrect password!");
        }
    });

    // --- Notification Broadcast Logic ---
    async function loadNotice() {
        try {
            const docSnap = await getDoc(doc(db, "settings", "notice"));
            if (docSnap.exists() && docSnap.data().text) {
                document.getElementById('notice-input').value = docSnap.data().text;
            }
        } catch (error) {
            console.error("Error loading notice:", error);
        }
    }

    document.getElementById('save-notice').addEventListener('click', async () => {
        const inputEl = document.getElementById('notice-input');
        if (!inputEl) return alert("Error: Notice input field missing.");
        
        const text = inputEl.value.trim();
        if (!text) return alert("Please enter a notice message.");
        
        try {
            await setDoc(doc(db, "settings", "notice"), { text: text }, { merge: true });
            alert('Broadcast notification published to store!');
        } catch (error) {
            console.error("Error saving notice:", error);
            alert("Failed to publish notification. Check Firebase rules/console.");
        }
    });

    document.getElementById('clear-notice').addEventListener('click', async () => {
        const inputEl = document.getElementById('notice-input');
        
        try {
            await setDoc(doc(db, "settings", "notice"), { text: "" }, { merge: true });
            if (inputEl) inputEl.value = "";
            alert('Notification cleared from store!');
        } catch (error) {
            console.error("Error clearing notice:", error);
            alert("Failed to clear notification. Check Firebase rules/console.");
        }
    });

    // --- Voting Sites Logic ---
    async function loadVotingSites() {
        const select = document.getElementById('vote-site-select');
        select.innerHTML = '';
        votingSitesCache = {};

        try {
            const querySnap = await getDocs(collection(db, "votesites"));
            querySnap.forEach(d => {
                votingSitesCache[d.id] = d.data();
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.innerText = d.data().name || d.id;
                select.appendChild(opt);
            });

            if (Object.keys(votingSitesCache).length > 0) {
                fillVoteSiteForm();
            } else {
                document.getElementById('vote-site-name').value = '';
                document.getElementById('vote-site-url').value = '';
            }
        } catch (error) {
            console.error("Error loading voting sites:", error);
        }
    }

    function fillVoteSiteForm() {
        const selectedId = document.getElementById('vote-site-select').value;
        if (selectedId && votingSitesCache[selectedId]) {
            document.getElementById('vote-site-name').value = votingSitesCache[selectedId].name || '';
            document.getElementById('vote-site-url').value = votingSitesCache[selectedId].url || '';
        }
    }

    document.getElementById('vote-site-select').addEventListener('change', fillVoteSiteForm);

    document.getElementById('save-vote-site').addEventListener('click', async () => {
        const selectedId = document.getElementById('vote-site-select').value;
        if (!selectedId) return alert("No voting site selected!");

        const name = document.getElementById('vote-site-name').value.trim();
        const url = document.getElementById('vote-site-url').value.trim();

        if (!name || !url) return alert("Please fill out both Name and URL.");

        try {
            await setDoc(doc(db, "votesites", selectedId), { name: name, url: url }, { merge: true });
            alert("Voting site updated!");
            loadVotingSites();
        } catch (error) {
            console.error("Error updating voting site:", error);
            alert("Failed to update site.");
        }
    });

    document.getElementById('delete-vote-site').addEventListener('click', async () => {
        const selectedId = document.getElementById('vote-site-select').value;
        if (!selectedId) return alert("No voting site selected!");

        if (confirm("Are you sure you want to delete this voting site?")) {
            try {
                await deleteDoc(doc(db, "votesites", selectedId));
                alert("Voting site removed!");
                loadVotingSites();
            } catch (error) {
                console.error("Error deleting voting site:", error);
                alert("Failed to remove voting site.");
            }
        }
    });

    document.getElementById('add-vote-site').addEventListener('click', async () => {
        const name = document.getElementById('new-vote-name').value.trim();
        const url = document.getElementById('new-vote-url').value.trim();

        if (!name || !url) return alert("Please enter both a Site Name and URL link.");

        const docId = name.toLowerCase().replace(/[^a-z0-9]/g, '_');

        try {
            await setDoc(doc(db, "votesites", docId), { name: name, url: url });
            alert("New voting site added!");
            document.getElementById('new-vote-name').value = '';
            document.getElementById('new-vote-url').value = '';
            loadVotingSites();
        } catch (error) {
            console.error("Error adding voting site:", error);
            alert("Failed to add voting site.");
        }
    });

    // Custom File Readers
    document.getElementById('rank-logo-upload').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
            customEditLogoBase64 = await readFileAsDataURL(file);
            alert("Custom image uploaded and ready to save!");
        }
    });

    document.getElementById('new-rank-logo-upload').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
            customNewLogoBase64 = await readFileAsDataURL(file);
            alert("Custom image uploaded for new rank!");
        }
    });

    // Save SMP Name
    document.getElementById('save-smp-name').addEventListener('click', async () => {
        const name = document.getElementById('smp-name-input').value.trim();
        if (!name) return alert("Please enter an SMP name.");
        await setDoc(doc(db, "settings", "server"), { name: name }, { merge: true });
        alert('Server name updated!');
    });

    // Load Socials
    async function loadSocials() {
        const docSnap = await getDoc(doc(db, "settings", "socials"));
        if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.discord) document.getElementById('discord-input').value = data.discord;
            if (data.youtube) document.getElementById('youtube-input').value = data.youtube;
            if (data.tiktok) document.getElementById('tiktok-input').value = data.tiktok;
        }
    }

    // Save Social Links
    document.getElementById('save-socials').addEventListener('click', async () => {
        await setDoc(doc(db, "settings", "socials"), {
            discord: document.getElementById('discord-input').value.trim(),
            youtube: document.getElementById('youtube-input').value.trim(),
            tiktok: document.getElementById('tiktok-input').value.trim()
        }, { merge: true });
        alert('Social links updated successfully!');
    });

    // Load Ranks into dropdown
    async function loadAllRanksIntoSelect() {
        const select = document.getElementById('rank-select');
        select.innerHTML = '';
        
        const defaultKeys = ['VIP', 'VIP+', 'VIP++', 'VIP+++'];
        const querySnap = await getDocs(collection(db, "ranks"));
        
        let dbMap = {};
        querySnap.forEach(d => dbMap[d.id] = d.data());

        let keys = [...defaultKeys, ...Object.keys(dbMap)];
        keys = Array.from(new Set(keys)).filter(k => !dbMap[k] || dbMap[k].deleted !== true);

        keys.forEach(k => {
            const opt = document.createElement('option');
            opt.value = k;
            opt.innerText = k;
            select.appendChild(opt);
        });

        if (keys.length > 0) loadRankDetails();
    }

    async function loadRankDetails() {
        const selectedRank = document.getElementById('rank-select').value;
        if (!selectedRank) return;

        customEditLogoBase64 = null;
        document.getElementById('rank-logo-upload').value = "";

        const docSnap = await getDoc(doc(db, "ranks", selectedRank));

        if (docSnap.exists() && !docSnap.data().deleted) {
            const data = docSnap.data();
            document.getElementById('rank-display-title').value = data.title || selectedRank;
            document.getElementById('rank-price-input').value = data.price || '';
            document.getElementById('rank-benefits-input').value = (data.benefits || []).join(', ');
            if (data.logo && !data.logo.startsWith('data:image')) {
                document.getElementById('rank-logo-select').value = data.logo;
            }
        } else {
            document.getElementById('rank-display-title').value = selectedRank;
            document.getElementById('rank-price-input').value = '';
            document.getElementById('rank-benefits-input').value = '';
        }
    }

    document.getElementById('rank-select').addEventListener('change', loadRankDetails);

    // Save Rank Updates
    document.getElementById('save-rank').addEventListener('click', async () => {
        const rankKey = document.getElementById('rank-select').value;
        if (!rankKey) return;

        const chosenLogo = customEditLogoBase64 || document.getElementById('rank-logo-select').value;

        await setDoc(doc(db, "ranks", rankKey), {
            title: document.getElementById('rank-display-title').value.trim() || rankKey,
            price: document.getElementById('rank-price-input').value.trim(),
            logo: chosenLogo,
            benefits: document.getElementById('rank-benefits-input').value.split(',').map(s => s.trim()).filter(Boolean),
            deleted: false
        }, { merge: true });

        alert(`${rankKey} rank saved successfully!`);
    });

    // Remove / Delete Rank
    document.getElementById('delete-rank').addEventListener('click', async () => {
        const rankKey = document.getElementById('rank-select').value;
        if (!rankKey) return;

        if (confirm(`Are you sure you want to remove the "${rankKey}" rank from the store?`)) {
            await setDoc(doc(db, "ranks", rankKey), { deleted: true }, { merge: true });
            alert(`Rank "${rankKey}" has been removed!`);
            loadAllRanksIntoSelect();
        }
    });

    // Add New Custom Rank
    document.getElementById('create-rank').addEventListener('click', async () => {
        const rankKey = document.getElementById('new-rank-id').value.trim().toUpperCase();
        if(!rankKey) return alert("Please enter a Rank Key ID!");

        const chosenLogo = customNewLogoBase64 || document.getElementById('new-rank-logo').value;

        await setDoc(doc(db, "ranks", rankKey), {
            title: document.getElementById('new-rank-title').value.trim() || rankKey,
            price: document.getElementById('new-rank-price').value.trim(),
            logo: chosenLogo,
            benefits: document.getElementById('new-rank-benefits').value.split(',').map(s => s.trim()).filter(Boolean),
            deleted: false
        }, { merge: true });

        alert(`New rank "${rankKey}" created!`);
        customNewLogoBase64 = null;
        document.getElementById('new-rank-logo-upload').value = "";
        loadAllRanksIntoSelect();
    });
</script>
</body>
</html>
